<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитический Дашборд Вакансий</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <div class="container my-5">
        <h1 class="mb-4 text-center">Аналитика рынка IT-вакансий</h1>

        <!-- БЛОК ФИЛЬТРОВ -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <!-- Поиск по названию вакансии -->
                    <div class="col-md-6">
                        <label for="searchInput" class="form-label font-weight-bold">Поиск по должности:</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Например: Python, Backend...">
                    </div>

                    <!-- Фильтр по опыту работы -->
                    <div class="col-md-6">
                        <label for="experienceSelect" class="form-label font-weight-bold">Опыт работы:</label>
                        <select id="experienceSelect" class="form-select">
                            <option value="">Все уровни</option>
                            <option value="junior">Junior (без опыта / до 1 года)</option>
                            <option value="middle">Middle (1-3 года)</option>
                            <option value="senior">Senior (3+ лет)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

<!-- КАРТОЧКИ МЕТРИК -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 bg-primary text-white">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-white-50 mb-1">Всего вакансий</h6>
                            <h2 class="mb-0 fw-bold" id="totalVacanciesCount">0</h2>
                        </div>
                        <div class="fs-1 text-white-50">📊</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm border-0 bg-success text-white">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-white-50 mb-1">Средняя зарплата</h6>
                            <h2 class="mb-0 fw-bold" id="avgSalaryMetric">Не указана</h2>
                        </div>
                        <div class="fs-1 text-white-50">💰</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ГРАФИКИ -->
        <div class="row g-4">
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Топ востребованных навыков</h5>
                        <canvas id="skillsChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Опыт работы</h5>
                        <canvas id="experienceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <!-- ТАБЛИЦА ВАКАНСИЙ И ПАГИНАЦИЯ -->
        <div class="card shadow-sm mt-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Список вакансий</h5>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Название должности</th>
                                <th>Компания</th>
                                <th>Опыт</th>
                                <th>Зарплата</th>
                                <th>Ссылка</th>
                            </tr>
                        </thead>
                        <tbody id="vacanciesTableBody">
                            <!-- Сюда JS будет подставлять строки с вакансиями -->
                        </tbody>
                    </table>
                </div>

                <!-- Блок кнопок пагинации -->
                <nav class="d-flex justify-content-between align-items-center mt-3">
                    <span id="pageInfo" class="text-muted small">Страница 1 из 1</span>
                    <ul class="pagination mb-0">
                        <li class="page-item" id="prevPageBtn">
                            <button class="page-link" onclick="changePage(-1)">Назад</button>
                        </li>
                        <li class="page-item" id="nextPageBtn">
                            <button class="page-link" onclick="changePage(1)">Вперед</button>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные для хранения экземпляров Chart.js
        // (нужны, чтобы уничтожать старый график перед рисованием нового)
        let skillsChartInstance = null;
        let experienceChartInstance = null;

        async function loadDashboardData() {
            // 1. Получаем значения из полей ввода
            const searchVal = document.getElementById('searchInput').value;
            const expVal = document.getElementById('experienceSelect').value;

            // 2. Формируем URL с параметрами фильтрации
            const url = new URL('/api/dashboard-data/', window.location.origin);
            if (searchVal) url.searchParams.append('search', searchVal);
            if (expVal) url.searchParams.append('experience', expVal);

            try {
                // 3. Отправляем фильтрованный запрос
                const response = await fetch(url);
                const data = await response.json();

                // 4. Перерисовываем графики
                renderSkillsChart(data.top_skills);
                renderExperienceChart(data.experience_levels);

            } catch (error) {
                console.error("Ошибка при загрузке данных:", error);
            }
        }

        function renderSkillsChart(topSkills) {
            const labels = topSkills.map(item => item.name);
            const counts = topSkills.map(item => item.count);
            const ctx = document.getElementById('skillsChart').getContext('2d');

            // Если график уже существует — уничтожаем его перед перезаписью
            if (skillsChartInstance) {
                skillsChartInstance.destroy();
            }

            skillsChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Количество вакансий',
                        data: counts,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function renderExperienceChart(experienceData) {
            const labels = experienceData.map(item => item.experience_level || 'Не указан');
            const counts = experienceData.map(item => item.count);
            const ctx = document.getElementById('experienceChart').getContext('2d');

            if (experienceChartInstance) {
                experienceChartInstance.destroy();
            }

            experienceChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.7)',
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(255, 206, 86, 0.7)',
                            'rgba(153, 102, 255, 0.7)'
                        ]
                    }]
                },
                options: { responsive: true }
            });
        }

        // ВЕШАЕМ СОБЫТИЯ НА ЭЛЕМЕНТЫ ФИЛЬТРОВ

        // При выборе опыта в <select> сразу перезагружаем данные
        document.getElementById('experienceSelect').addEventListener('change', loadDashboardData);

        // При вводе текста в текстовое поле с задержкой 300мс (debounce), чтобы не делать запрос на каждую букву
        let timeout = null;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(timeout);
            timeout = setTimeout(loadDashboardData, 300);
        });

        // Первая загрузка при открытии страницы
        loadDashboardData();

        // Глобальные переменные для управления текущей страницей
        let currentPage = 1;
        let totalPages = 1;

        // Основная функция загрузки дашборда (теперь запускает и загрузку вакансий)
        async function loadDashboardData() {
            // При смене фильтра сбрасываем страницу на первую
            currentPage = 1;
            
            // Параллельно обновляем и графики, и список вакансий
            await Promise.all([
                loadChartsData(),
                loadVacanciesData()
            ]);
        }

        // Загрузка данных для графиков
        // Загрузка данных для графиков и карточек метрик
        async function loadChartsData() {
            const searchVal = document.getElementById('searchInput').value;
            const expVal = document.getElementById('experienceSelect').value;

            const url = new URL('/api/dashboard-data/', window.location.origin);
            if (searchVal) url.searchParams.append('search', searchVal);
            if (expVal) url.searchParams.append('experience', expVal);

            try {
                const response = await fetch(url);
                const data = await response.json();

                // Обновляем метрики
                document.getElementById('totalVacanciesCount').innerText = data.total_vacancies || 0;
                
                if (data.avg_salary) {
                    document.getElementById('avgSalaryMetric').innerText = `${data.avg_salary.toLocaleString('ru-RU')} руб.`;
                } else {
                    document.getElementById('avgSalaryMetric').innerText = 'Не указана';
                }

                // Перерисовываем графики
                renderSkillsChart(data.top_skills);
                renderExperienceChart(data.experience_levels);
            } catch (error) {
                console.error("Ошибка при загрузке аналитики:", error);
            }
        }

        // Загрузка вакансий с пагинацией
        async function loadVacanciesData() {
            const searchVal = document.getElementById('searchInput').value;
            const expVal = document.getElementById('experienceSelect').value;

            // Формируем URL к роутеру вакансий
            const url = new URL('/api/vacancies/', window.location.origin);
            url.searchParams.append('page', currentPage);
            if (searchVal) url.searchParams.append('search', searchVal);
            if (expVal) url.searchParams.append('experience', expVal);

            try {
                const response = await fetch(url);
                const data = await response.json();

                // Расчитываем общее количество страниц (data.count — общее число записей, 10 — PAGE_SIZE)
                totalPages = Math.ceil(data.count / 10) || 1;

                renderVacanciesTable(data.results);
                updatePaginationControls();
            } catch (error) {
                console.error("Ошибка при загрузке вакансий:", error);
            }
        }

        // Отрисовка строк таблицы
        function renderVacanciesTable(vacancies) {
            const tbody = document.getElementById('vacanciesTableBody');
            tbody.innerHTML = ''; // Очищаем старые строки

            if (vacancies.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Вакансий не найдено</td></tr>';
                return;
            }

            vacancies.forEach(vac => {
                // Формируем вилку зарплаты для отображения
                let salaryText = 'Не указана';
                if (vac.salary_from || vac.salary_to) {
                    const fromStr = vac.salary_from ? `от ${vac.salary_from}` : '';
                    const toStr = vac.salary_to ? `до ${vac.salary_to}` : '';
                    const currStr = vac.currency || 'руб.';
                    salaryText = `${fromStr} ${toStr} ${currStr}`.trim();
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold">${vac.title}</td>
                    <td>${vac.company_name || 'Не указана'}</td>
                    <td><span class="badge bg-secondary">${vac.experience_level || 'Не указан'}</span></td>
                    <td>${salaryText}</td>
                    <td><a href="${vac.url || '#'}" target="_blank" class="btn btn-sm btn-outline-primary">Открыть</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Обновление состояния кнопок пагинации
        function updatePaginationControls() {
            document.getElementById('pageInfo').innerText = `Страница ${currentPage} из ${totalPages}`;
            
            // Включаем/отключаем кнопки "Назад" и "Вперед"
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');

            if (currentPage <= 1) {
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.classList.remove('disabled');
            }

            if (currentPage >= totalPages) {
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.classList.remove('disabled');
            }
        }

        // Переключение страницы по клику на Назад/Вперед
        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                loadVacanciesData();
            }
        }
    </script>
</body>
</html>
